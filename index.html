<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jam Kucing</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b1d0e">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" id="sky"></div>

  <main class="app">
    <!-- tombol atas -->
    <nav class="topbar">
      <button class="btn-icon" id="btn-mode" aria-label="Ganti mode jam analog/digital">🕰️</button>
      <button class="btn-icon" id="btn-alarm" aria-label="Atur alarm">⏰</button>
    </nav>

    <!-- kucing -->
    <section class="cat-stage" id="stage">
      <svg class="cat" id="cat" viewBox="0 0 200 200" role="img"
           aria-label="Kucing. Ketuk untuk meong, usap untuk elus.">
        <path class="tail" d="M150,150 Q180,130 170,95 Q165,75 150,80"
          fill="none" stroke="#7a5230" stroke-width="14" stroke-linecap="round"/>
        <ellipse cx="100" cy="145" rx="45" ry="40" fill="#8a6038"/>
        <rect x="80" y="165" width="14" height="25" rx="7" fill="#7a5230"/>
        <rect x="106" y="165" width="14" height="25" rx="7" fill="#7a5230"/>
        <circle cx="100" cy="95" r="42" fill="#8a6038"/>
        <polygon points="68,68 78,30 98,58" fill="#8a6038"/>
        <polygon points="132,68 122,30 102,58" fill="#8a6038"/>
        <polygon points="74,60 80,42 92,58" fill="#d8a878"/>
        <polygon points="126,60 120,42 108,58" fill="#d8a878"/>

        <g id="eyes-open">
          <ellipse cx="82" cy="95" rx="7" ry="9" fill="#1c1c1c"/>
          <ellipse cx="118" cy="95" rx="7" ry="9" fill="#1c1c1c"/>
          <circle cx="84" cy="92" r="2.5" fill="#fff"/>
          <circle cx="120" cy="92" r="2.5" fill="#fff"/>
        </g>
        <g id="eyes-closed" style="display:none">
          <path d="M74,95 Q82,100 90,95" fill="none" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M110,95 Q118,100 126,95" fill="none" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <g id="eyes-happy" style="display:none">
          <path d="M74,98 Q82,88 90,98" fill="none" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/>
          <path d="M110,98 Q118,88 126,98" fill="none" stroke="#1c1c1c" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- pipi merona saat dielus -->
        <g id="blush" style="display:none">
          <ellipse cx="72" cy="108" rx="7" ry="4" fill="#e88" opacity="0.6"/>
          <ellipse cx="128" cy="108" rx="7" ry="4" fill="#e88" opacity="0.6"/>
        </g>

        <polygon points="96,110 104,110 100,116" fill="#d98a8a"/>
        <path id="mouth" d="M100,116 Q95,122 90,120 M100,116 Q105,122 110,120"
          fill="none" stroke="#5a3a20" stroke-width="2" stroke-linecap="round"/>
        <line x1="70" y1="112" x2="48" y2="108" stroke="#5a3a20" stroke-width="1.5"/>
        <line x1="70" y1="117" x2="48" y2="120" stroke="#5a3a20" stroke-width="1.5"/>
        <line x1="130" y1="112" x2="152" y2="108" stroke="#5a3a20" stroke-width="1.5"/>
        <line x1="130" y1="117" x2="152" y2="120" stroke="#5a3a20" stroke-width="1.5"/>
      </svg>
      <div class="zzz" aria-hidden="true">Z<span>z</span><span>z</span></div>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </section>

    <!-- jam -->
    <section class="clock-card">
      <div class="digital" id="digital">
        <div class="time" id="time">00:00:00</div>
      </div>

      <svg class="analog" id="analog" viewBox="0 0 200 200" role="img" aria-label="Jam analog" hidden>
        <circle cx="100" cy="100" r="94" fill="rgba(255,255,255,0.08)" stroke="#f3d6b0" stroke-width="3"/>
        <g id="ticks"></g>
        <line id="hand-h" x1="100" y1="100" x2="100" y2="55" stroke="#f3d6b0" stroke-width="7" stroke-linecap="round"/>
        <line id="hand-m" x1="100" y1="100" x2="100" y2="30" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <line id="hand-s" x1="100" y1="115" x2="100" y2="22" stroke="#ff8a8a" stroke-width="2" stroke-linecap="round"/>
        <circle cx="100" cy="100" r="6" fill="#ff8a8a"/>
        <text x="100" y="140" text-anchor="middle" font-size="14" fill="#f3d6b0">🐾</text>
      </svg>

      <div class="date" id="date">—</div>
      <div class="mood" id="mood">Halo!</div>
      <div class="alarm-info" id="alarm-info"></div>
    </section>
  </main>

  <!-- panel alarm -->
  <dialog id="alarm-dialog" aria-labelledby="alarm-title">
    <form method="dialog" class="panel">
      <h2 id="alarm-title">Alarm Meong</h2>
      <label for="alarm-time">Jam bangun</label>
      <input type="time" id="alarm-time" value="06:00" required>
      <label class="row">
        <input type="checkbox" id="alarm-on"> Aktifkan alarm
      </label>
      <p class="note">Alarm hanya bunyi kalau app sedang terbuka. Layar dijaga tetap menyala selama alarm aktif.</p>
      <div class="actions">
        <button type="button" id="btn-test">🔊 Tes meong</button>
        <button type="submit" id="btn-save" value="save">Simpan</button>
      </div>
    </form>
  </dialog>

  <!-- layar alarm berbunyi -->
  <div class="ringing" id="ringing" hidden role="alertdialog" aria-labelledby="ring-text">
    <div class="ring-cat">🙀</div>
    <div class="ring-text" id="ring-text">Meong! Waktunya bangun</div>
    <div class="actions">
      <button id="btn-snooze">Tunda 5 menit</button>
      <button id="btn-stop" class="primary">Matikan</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
